name: Build and Push Frontend Image

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set image tag based on branch
        run: |
          if [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://afertech-backend-413472324664.southamerica-east1.run.app \
            -t ghcr.io/renzomasiero/afertech-frontend:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: docker push ghcr.io/renzomasiero/afertech-frontend:${{ env.IMAGE_TAG }}